# Confere o código (TypeScript) e o build a cada envio ao GitHub.
name: Verificar código
on:
  push:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verificar
      - run: npm run build
      - run: npm run build -- --outDir dist-teste
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_teste
      - run: |
          cd dist-teste && git init -q && git checkout -q -b teste-dist && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm teste
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" teste-dist
